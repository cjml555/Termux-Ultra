// Caché de compilaciones. Sin esto, cada build recompila desde cero lo mismo
// que el anterior ya compiló: CMake, Kotlin y el enlazado son deterministas,
// así que el resultado se puede reutilizar tal cual.
//
// Va aquí y no en build.gradle porque buildCache() es un método de
// Settings, no de Project.
//
// Local: directorio dentro del proyecto, sin red.
buildCache {
    local {
        directory = new File(rootDir, '.gradle-build-cache')
    }
}

rootProject.name = "KiTerminal-UX"
include ':app'
include ':termux-shared'

// Vendor add-ons (built as sub-projects from vendor/termux-addons)
include ':termux-api'
project(':termux-api').projectDir = new File(rootDir, 'vendor/termux-addons/termux-api/app')
include ':termux-styling'
project(':termux-styling').projectDir = new File(rootDir, 'vendor/termux-addons/termux-styling/app')
include ':termux-tasker'
project(':termux-tasker').projectDir = new File(rootDir, 'vendor/termux-addons/termux-tasker/app')
include ':termux-widget'
project(':termux-widget').projectDir = new File(rootDir, 'vendor/termux-addons/termux-widget/app')

